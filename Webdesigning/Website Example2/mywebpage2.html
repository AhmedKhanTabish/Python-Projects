<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Designing Tab</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>

<div class="tab">
  <button class="tablinks" onclick="openTab(event, 'template')">Template</button>
  <button class="tablinks" onclick="openTab(event, 'color')">Color Options</button>
  <button class="tablinks" onclick="openTab(event, 'placement')">Placement</button>
  <button class="tablinks" onclick="openTab(event, 'preview')">Preview</button>
  <button class="tablinks" onclick="openTab(event, 'save')">Save</button>
</div>

<div id="template" class="tabcontent">
  <h3>Choose a Template</h3>
  <select id="templateSelect">
    <option value="template1">Template 1</option>
    <option value="template2">Template 2</option>
    <option value="template3">Template 3</option>
  </select>
</div>

<div id="color" class="tabcontent">
  <h3>Color Options</h3>
  <!-- Color selection options -->
  <input type="color" id="colorPicker">
</div>

<div id="placement" class="tabcontent">
  <h3>Placement Options</h3>
  <!-- Placement selection options -->
  <button onclick="addTextBox()">Add Text Box</button>
  <button onclick="addImage()">Add Image</button>
  <button onclick="addTitle()">Add Title</button>
  <button onclick="addFooter()">Add Footer</button>
  <div id="designArea" class="design-area"></div>
</div>

<div id="preview" class="tabcontent">
  <h3>Preview</h3>
  <!-- Display preview of the webpage -->
  <iframe id="previewFrame" style="width: 100%; height: 400px;"></iframe>
</div>

<div id="save" class="tabcontent">
  <h3>Save as HTML File</h3>
  <button onclick="saveHTML()">Save</button>
</div>

<script src="script.js"></script>
</body>
</html>
